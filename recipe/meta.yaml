{% set name = "mcp" %}
{% set version = "2.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8b147a50441cf059dc88c684e0aeed3687f0aa0f39c6cde7b90330effd2b34d8

build:
  skip: true  # [py<310]
  entry_points:
    - mcp = mcp.cli:app
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - pip
    - hatchling
    - uv-dynamic-versioning
  run:
    - python
    - anyio >=4.10  # [py>=314]
    - anyio >=4.9  # [py<314]
    - httpx2 >=2.10.0
    - mcp-types =={{ version }}
    - pydantic >=2.12.0
    - starlette >=0.48.0  # [py>=314]
    - starlette >=0.27  # [py<314]
    - python-multipart >=0.0.9
    - sse-starlette >=3.0.0
    - uvicorn >=0.31.1
    - jsonschema >=4.20.0
    - pywin32 >=311  # [win]
    # pyjwt[crypto]
    - pyjwt >=2.10.1
    - cryptography
    - typing-extensions >=4.13.0
    - typing-inspection >=0.4.1
    - opentelemetry-api >=1.28.0
  run_constrained:
    # rich
    - rich >=13.9.4
    # cli
    - typer >=0.16.0
    - python-dotenv >=1.0.0

# Only the upstream test suites whose dependencies are absent from the main
# channel are ignored:
#   - tests/test_examples.py imports pytest_examples (PyPI-only)
#   - tests/examples imports stories (mcp-example-stories, PyPI-only)
#   - tests/docs imports the docs toolchain (zensical, mkdocstrings, griffelib)
{% set ignored_tests = " --ignore=tests/test_examples.py" %}
{% set ignored_tests = ignored_tests + " --ignore=tests/examples" %}
{% set ignored_tests = ignored_tests + " --ignore=tests/docs" %}

test:
  source_files:
    - tests
    - examples
    - docs_src
    - docs
    - README.md
  imports:
    - mcp
  commands:
    - pip check
    - mcp --help
    - pytest -vv tests {{ ignored_tests }}
  requires:
    - pip
    - pytest
    - python-dotenv
    - typer
    - logfire
    # inline-snapshot 0.35.3 compares `set` snapshots through the AST node of the
    # snapshot expression, which is not found under pytest's assertion rewriting
    # on python 3.10 only (python 3.11+ is unaffected); pin back for 3.10.
    - inline-snapshot <0.35.3  # [py<311]
    - inline-snapshot  # [py>=311]
    - trio
    - dirty-equals
    - coverage
    - tomli
    - python-blockbuster

about:
  home: https://modelcontextprotocol.io
  summary: The official Python SDK for Model Context Protocol servers and clients
  description: |
    The Model Context Protocol allows applications to provide context for LLMs in a standardized way, separating the concerns of providing context from the actual LLM interaction. This Python SDK implements the full MCP specification, making it easy to:

    * Build MCP clients that can connect to any MCP server
    * Create MCP servers that expose resources, prompts and tools
    * Use standard transports like stdio and SSE
    * Handle all MCP protocol messages and lifecycle events
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/modelcontextprotocol/python-sdk
  doc_url: https://py.sdk.modelcontextprotocol.io

extra:
  recipe-maintainers:
    - dbast
