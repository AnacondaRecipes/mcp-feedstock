{% set name = "mcp" %}
{% set version = "2.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0f440e735c13ece8bb19bc62cf0b86f4313448432fbb77d35e14034f4e050728

build:
  skip: true  # [py<310]
  entry_points:
    - mcp = mcp.cli:app
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - hatchling
    - uv-dynamic-versioning
    - pip
  run:
    - python
    - anyio>=4.10  # [py>=314]
    - anyio >=4.9  # [py<314]
    - httpx2 >=2.5.0
    - mcp-types =={{ version }}
    - pydantic >=2.12.0
    - starlette >=0.48.0  # [py>=314]
    - starlette >=0.27  # [py<314]
    - python-multipart >=0.0.9
    - sse-starlette >=3.0.0
    - uvicorn >=0.31.1
    - jsonschema >=4.20.0
    - pywin32 >=311  # [win]
    # pyjwt[crypto]
    - pyjwt >=2.10.1
    - cryptography
    - typing-extensions >=4.13.0
    - typing-inspection >=0.4.1
    - opentelemetry-api >=1.28.0
  run_constrained:
    # rich
    - rich >=13.9.4
    # cli
    - typer >=0.16.0
    - python-dotenv >=1.0.0

