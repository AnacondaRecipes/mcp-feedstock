{% set name = "mcp" %}
{% set version = "1.29.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/mcp-{{ version }}.tar.gz
  sha256: 52d01f334de1868cc3bb2d6604931126a67631f99a6c5d3b82ba47290315ec36

build:
  skip: true  # [py<310]
  entry_points:
    - mcp = mcp.cli:app
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - hatchling
    - pip
  run:
    - python
    - anyio >=4.5
    - httpx >=0.27.1,<1.0.0
    - httpx-sse >=0.4
    - pydantic >=2.12.0,<3.0.0  # [py>=314]
    - pydantic >=2.11.0,<3.0.0  # [py<314]
    - starlette >=0.48.0  # [py>=314]
    - starlette >=0.27  # [py<314]
    - python-multipart >=0.0.9
    - sse-starlette >=1.6.1
    - pydantic-settings >=2.5.2
    - uvicorn >=0.31.1
    - jsonschema >=4.20.0
    - pywin32 >=311  # [win and py>=314]
    - pywin32 >=310  # [win and py<314]
    - pyjwt >=2.10.1
    - cryptography
    - typing-extensions >=4.9.0
    - typing-inspection >=0.4.1
  run_constrained:
    # ws
    - websockets >=15.0.1
    # cli
    - python-dotenv >=1.0.0
    - typer >=0.16.0
    # rich
    - rich >=13.9.4

test:
  imports:
    - mcp
  commands:
    - pip check
    - mcp --help
  requires:
    - pip
    - python-dotenv
    - typer

about:
  home: https://modelcontextprotocol.io/
  summary: The official Python SDK for Model Context Protocol servers and clients
  description: |
    The Model Context Protocol allows applications to provide context for LLMs in a standardized way, separating the concerns of providing context from the actual LLM interaction. This Python SDK implements the full MCP specification, making it easy to:

    * Build MCP clients that can connect to any MCP server
    * Create MCP servers that expose resources, prompts and tools
    * Use standard transports like stdio and SSE
    * Handle all MCP protocol messages and lifecycle events
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/modelcontextprotocol/python-sdk
  doc_url: https://github.com/modelcontextprotocol/python-sdk/blob/main/README.md

extra:
  recipe-maintainers:
    - dbast
